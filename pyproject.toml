[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-safety-kit"
version = "0.1.0"
description = "Fail-closed guard rails for automated trading: order allowlist, transport gate, reconciliation, leakage-guarded backtests, paired stats."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "melon6142-eng" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
backtest = ["pandas>=2.0"]
dev = ["pytest>=7", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
